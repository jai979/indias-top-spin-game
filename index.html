<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>India's Top Spin Games</title>
    <style>
        body { background-color: #e8e5d3; font-family: Arial; margin: 0; padding: 0; text-align: center; }
        
        /* Dark Header */
        .header { background-color: #1a1a1a; padding: 15px; color: white; }
        .header h1 { margin: 0; font-size: 22px; color: #ffffff; }
        .header p { margin: 5px 0 0; font-size: 14px; color: #bbbbbb; }

        .main-title { color: #8b0000; font-size: 20px; margin-bottom: 20px; }
        
        /* 2 Games side-by-side (Grid Layout) */

        .game-name { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .stars { color: #f5b041; font-size: 16px; margin-bottom: 10px; }
        
        .download-btn {
            display: block; width: 100%; background-color: #dcdcdc; color: blue;
            text-decoration: underline; font-size: 16px; font-weight: bold;
            padding: 8px; border-radius: 8px; border: 1px solid #ccc;
        }
    </style>
</head>

</html>
