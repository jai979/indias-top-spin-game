<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India's Top Spin Game</title>
    <style>
        /* Basic styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin-top: 50px;
        }
        h1 {
            color: #ff9933; /* Saffron color */
        }
        .game-container {
            margin-top: 30px;
            padding: 20px;
            border: 2px dashed #138808; /* Green color */
            display: inline-block;
            border-radius: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Welcome to India's Top Spin Game!</h1>
    
    <div class="game-container">
        <p>Yahan aapka game aayega.</p>
        <button id="spinBtn">SPIN</button>
    </div>

    <script>
        // Simple JavaScript for the button
        document.getElementById('spinBtn').addEventListener('click', function() {
            alert('Spin button dabaya gaya! Ab yahan game logic aayega.');
        });
    </script>

</body>
</html>
